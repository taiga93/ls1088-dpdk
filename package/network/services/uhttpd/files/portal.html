<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BMC Firewall Portal Login</title>
  <link rel="icon" type="image/png" href="./iconnho.png" />
  <link rel="shortcut icon" type="image/png" href="./iconnho.png" />
  <style>
    :root {
      --portal-bg: #040b16;
      --portal-bg-layer: #091326;
      --portal-surface: rgba(10, 18, 34, 0.88);
      --portal-surface-soft: rgba(8, 15, 29, 0.94);
      --portal-border: rgba(148, 163, 184, 0.18);
      --portal-border-strong: rgba(56, 189, 248, 0.24);
      --portal-text: #f8fafc;
      --portal-text-main: #dbe4f1;
      --portal-text-soft: rgba(226, 232, 240, 0.72);
      --portal-cyan: #38bdf8;
      --portal-blue: #1d4ed8;
      --portal-emerald: #34d399;
      --portal-amber: #fbbf24;
      --portal-rose: #fb7185;
      --portal-shadow:
        0 24px 44px rgba(2, 8, 23, 0.34),
        0 10px 18px rgba(15, 23, 42, 0.2);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", "Inter", "Roboto", Arial, sans-serif;
      color: var(--portal-text-main);
      background: linear-gradient(160deg, var(--portal-bg), var(--portal-bg-layer) 52%, #0f172a);
      position: relative;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      pointer-events: none;
      display: none;
      opacity: 0;
      z-index: 0;
    }

    body::before {
      top: 3rem;
      right: -5rem;
      width: 18rem;
      height: 18rem;
      background: none;
    }

    body::after {
      left: -4rem;
      bottom: 1rem;
      width: 16rem;
      height: 16rem;
      background: none;
    }

    a {
      color: #7dd3fc;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    a:hover {
      color: #bae6fd;
    }

    button,
    input {
      font: inherit;
    }

    .portal-shell {
      width: min(1120px, 100%);
      position: relative;
      z-index: 1;
    }

    .portal-card {
      display: grid;
      grid-template-columns: 1fr;
      border-radius: 28px;
      border: 1px solid var(--portal-border);
      background: linear-gradient(135deg, rgba(7, 20, 40, 0.98), rgba(13, 26, 49, 0.94));
      box-shadow: var(--portal-shadow);
      overflow: hidden;
    }

    .portal-form-panel {
      padding: clamp(1.5rem, 4vw, 3rem);
    }

    .portal-kicker {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      width: fit-content;
      padding: 0.45rem 0.85rem;
      border-radius: 999px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 0.72rem;
      font-weight: 700;
      border: 1px solid rgba(251, 191, 36, 0.24);
      background: rgba(251, 191, 36, 0.08);
      color: #fde68a;
    }

    .portal-form-panel {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1.35rem;
    }

    .portal-heading {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }

    .portal-heading h2 {
      margin: 0;
      font-size: clamp(1.9rem, 4vw, 2.6rem);
      line-height: 1;
      letter-spacing: -0.03em;
      font-weight: 800;
    }

    .portal-error[hidden] {
      display: none;
    }

    .portal-error {
      margin: 0;
      color: #fda4af;
      font-size: 0.9rem;
      line-height: 1.6;
    }

    .portal-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .portal-field label {
      display: block;
      margin: 0 0 0.45rem 0.35rem;
      color: rgba(226, 232, 240, 0.76);
      font-size: 0.76rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 600;
    }

    .portal-input-wrap {
      position: relative;
    }

    .portal-input-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      width: 2rem;
      height: 2rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      color: rgba(226, 232, 240, 0.64);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      transform: translateY(-50%);
      pointer-events: none;
      transition: color 0.25s ease, background-color 0.25s ease, transform 0.25s ease;
    }

    .portal-input {
      width: 100%;
      height: 58px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.72);
      color: var(--portal-text);
      padding: 0 1rem 0 3.8rem;
      font-size: 1rem;
      outline: none;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
      transition: border-color 0.25s ease, background-color 0.25s ease, box-shadow 0.25s ease, transform 0.25s ease;
    }

    .portal-input.has-password-toggle {
      padding-right: 3.35rem;
    }

    .portal-input::placeholder {
      color: rgba(226, 232, 240, 0.54);
    }

    .portal-input:focus {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--portal-cyan);
      box-shadow:
        0 0 0 4px rgba(56, 189, 248, 0.12),
        0 16px 28px rgba(8, 15, 29, 0.24);
    }

    .portal-input-wrap:focus-within .portal-input-icon {
      color: var(--portal-cyan);
      background: rgba(56, 189, 248, 0.12);
      transform: translate(-2px, -50%);
    }

    .portal-toggle-password {
      position: absolute;
      top: 50%;
      right: 0.72rem;
      transform: translateY(-50%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.06);
      color: rgba(226, 232, 240, 0.72);
      cursor: pointer;
      font-size: 0;
      transition: color 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;
    }

    .portal-toggle-password:hover,
    .portal-input-wrap:focus-within .portal-toggle-password {
      color: var(--portal-text);
      border-color: rgba(56, 189, 248, 0.34);
    }

    .portal-toggle-password:disabled {
      opacity: 0.58;
      cursor: not-allowed;
    }

    .portal-toggle-password::before {
      content: "";
      width: 16px;
      height: 16px;
      border: 2px solid currentColor;
      border-radius: 999px / 700px;
      transform: scaleX(1.25);
    }

    .portal-toggle-password::after {
      content: "";
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 999px;
      background: currentColor;
    }

    .portal-toggle-password.is-visible::after {
      width: 18px;
      height: 2px;
      border-radius: 999px;
      transform: rotate(-35deg);
    }

    .portal-submit {
      width: 100%;
      height: 56px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--portal-cyan), var(--portal-blue));
      color: #eff6ff;
      letter-spacing: 0.01em;
      font-size: 0.84rem;
      font-weight: 800;
      box-shadow: 0 16px 28px rgba(37, 99, 235, 0.24);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }

    .portal-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 30px rgba(37, 99, 235, 0.28);
      filter: brightness(1.03);
    }

    .portal-submit:disabled {
      opacity: 0.74;
      cursor: not-allowed;
      transform: none;
      box-shadow:
        0 10px 18px rgba(15, 23, 42, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
      filter: none;
    }

    @media (max-width: 720px) {
      body {
        padding: 14px;
      }

      .portal-card {
        border-radius: 24px;
      }
    }

    @media (max-width: 560px) {
      .portal-heading h2 {
        font-size: 1.9rem;
      }

      .portal-submit,
      .portal-input {
        height: 54px;
      }
    }
  </style>
</head>
<body>
  <main class="portal-shell" role="main" aria-label="Network login portal">
    <section class="portal-card">
      <div class="portal-form-panel">
        <div class="portal-heading">
          <span class="portal-kicker">Captive Portal</span>
          <h2>Network Login</h2>
        </div>

        <p id="error-message" class="portal-error" role="alert" aria-live="polite" hidden></p>

        <form id="login-form" class="portal-form" novalidate>
          <div class="portal-field">
            <label for="username">Username</label>
            <div class="portal-input-wrap">
              <span class="portal-input-icon" aria-hidden="true">ID</span>
              <input
                class="portal-input"
                type="text"
                id="username"
                placeholder="Username"
                autocomplete="username"
                required
                aria-required="true"
              />
            </div>
          </div>

          <div class="portal-field">
            <label for="password">Password</label>
            <div class="portal-input-wrap">
              <span class="portal-input-icon" aria-hidden="true">PW</span>
              <input
                class="portal-input has-password-toggle"
                type="password"
                id="password"
                placeholder="Password"
                autocomplete="current-password"
                required
                aria-required="true"
              />
              <button id="toggle-password" class="portal-toggle-password" type="button" aria-label="Show password" title="Show password"></button>
            </div>
          </div>

          <button id="login-button" class="portal-submit" type="submit">Log In</button>
        </form>
      </div>
    </section>
  </main>

  <script>
    const PORTAL_CONTEXT_STORAGE_KEY = "portalContextV1";
    const PORTAL_SKIP_ACTIVE_CHECK_UNTIL_KEY = "portalSkipActiveCheckUntilV1";
    let uamip = "";
    let uamport = "3990";
    let challenge = "";
    let userurl = "";
    let clientIp = "";
    let loginInFlight = false;

    const errorMessageEl = document.getElementById("error-message");
    const loginFormEl = document.getElementById("login-form");
    const loginButtonEl = document.getElementById("login-button");
    const usernameInputEl = document.getElementById("username");
    const passwordInputEl = document.getElementById("password");
    const togglePasswordButtonEl = document.getElementById("toggle-password");

    function showError(message) {
      errorMessageEl.textContent = message;
      errorMessageEl.hidden = false;
    }

    function hideError() {
      errorMessageEl.textContent = "";
      errorMessageEl.hidden = true;
    }

    function updatePortalDetails() {}

    function loadStoredPortalContext() {
      try {
        const rawValue = window.localStorage.getItem(PORTAL_CONTEXT_STORAGE_KEY);
        if (!rawValue) {
          return null;
        }

        const parsed = JSON.parse(rawValue);
        return typeof parsed === "object" && parsed ? parsed : null;
      } catch (error) {
        console.warn("Unable to load stored portal context:", error);
        return null;
      }
    }

    function savePortalContext() {
      try {
        const payload = {
          uamip: uamip || "",
          uamport: uamport || "3990",
          challenge: challenge || "",
          userurl: userurl || ""
        };
        window.localStorage.setItem(PORTAL_CONTEXT_STORAGE_KEY, JSON.stringify(payload));
      } catch (error) {
        console.warn("Unable to save portal context:", error);
      }
    }

    function shouldSkipActiveSessionRedirect() {
      try {
        const rawValue = window.localStorage.getItem(PORTAL_SKIP_ACTIVE_CHECK_UNTIL_KEY);
        if (!rawValue) {
          return false;
        }

        const untilMs = Number(rawValue);
        if (!Number.isFinite(untilMs) || untilMs <= Date.now()) {
          window.localStorage.removeItem(PORTAL_SKIP_ACTIVE_CHECK_UNTIL_KEY);
          return false;
        }

        return true;
      } catch (error) {
        console.warn("Unable to read active-session redirect skip flag:", error);
        return false;
      }
    }

    function hasKnownUserActiveSession(payload) {
      const session = payload?.session;
      if (!session) {
        return false;
      }

      const username = String(session.user || "").trim().toLowerCase();
      const state = String(session.state || "").trim().toLowerCase();
      const authorized = String(session.authorized || "").trim();

      return Boolean(username && username !== "unknown") && (state === "pass" || authorized === "1");
    }

    function buildSessionPageUrl(clientIpValue) {
      const sessionPageUrl = new URL("/portal_session.html", window.location.origin);
      if (clientIpValue) {
        sessionPageUrl.searchParams.set("client_ip", clientIpValue);
      }
      sessionPageUrl.searchParams.set("uamip", uamip);
      sessionPageUrl.searchParams.set("uamport", uamport);
      if (userurl) {
        sessionPageUrl.searchParams.set("userurl", userurl);
      }
      return sessionPageUrl.toString();
    }

    async function redirectIfAlreadyLoggedIn() {
      if (shouldSkipActiveSessionRedirect()) {
        return;
      }

      try {
        const sessionUrl = clientIp
          ? `/cgi-bin/portal_session.sh?client_ip=${encodeURIComponent(clientIp)}`
          : "/cgi-bin/portal_session.sh";
        const res = await fetch(sessionUrl, { cache: "no-store" });
        const rawBody = await res.text();
        const data = rawBody ? JSON.parse(rawBody) : null;

        if (!res.ok || !data || !(data.status === 0 || String(data.status) === "0")) {
          return;
        }

        if (!hasKnownUserActiveSession(data)) {
          return;
        }

        const resolvedClientIp = data.client_ip || data.session?.ip || clientIp || "";
        clientIp = resolvedClientIp;
        savePortalContext();
        window.location.replace(buildSessionPageUrl(resolvedClientIp));
      } catch (error) {
        console.warn("Active session redirect check failed:", error);
      }
    }

    function setSubmitting(isSubmitting) {
      loginInFlight = isSubmitting;
      loginButtonEl.disabled = isSubmitting;
      usernameInputEl.disabled = isSubmitting;
      passwordInputEl.disabled = isSubmitting;
      togglePasswordButtonEl.disabled = isSubmitting;
      loginButtonEl.textContent = isSubmitting ? "Signing In..." : "Log In";
    }

    (function extractFromLoginUrl() {
      try {
        const storedContext = loadStoredPortalContext();
        const fullQuery = new URLSearchParams(window.location.search);
        const loginurlEncoded = fullQuery.get("loginurl");
        uamip = window.location.hostname || "";
        uamport = "3990";
        challenge = "";
        userurl = "";
        clientIp = "";

        if (loginurlEncoded) {
          const loginurl = decodeURIComponent(loginurlEncoded);
          const parsedLogin = new URL(loginurl);

          uamip = parsedLogin.searchParams.get("uamip") || parsedLogin.hostname;
          uamport = parsedLogin.searchParams.get("uamport") || parsedLogin.port || "3990";
          challenge = parsedLogin.searchParams.get("challenge") || "";
          userurl = decodeURIComponent(parsedLogin.searchParams.get("userurl") || "");
          clientIp = parsedLogin.searchParams.get("ip") || "";
        } else {
          uamip = fullQuery.get("uamip") || uamip;
          uamport = fullQuery.get("uamport") || uamport;
          challenge = fullQuery.get("challenge") || "";
          userurl = decodeURIComponent(fullQuery.get("userurl") || "");
          clientIp = fullQuery.get("client_ip") || fullQuery.get("ip") || "";
        }

        if (storedContext) {
          uamip = uamip || storedContext.uamip || "";
          uamport = uamport || storedContext.uamport || "3990";
          challenge = challenge || storedContext.challenge || "";
          userurl = userurl || storedContext.userurl || "";
        }

        updatePortalDetails();
        savePortalContext();
      } catch (err) {
        updatePortalDetails();
        console.error("Portal bootstrap failed:", err);
      }
    })();

    async function submitLogin() {
      if (loginInFlight) {
        return;
      }

      const user = usernameInputEl.value.trim();
      const pass = passwordInputEl.value.trim();

      if (!user || !pass) {
        showError("Please enter both username and password.");
        return;
      }

      hideError();
      setSubmitting(true);

      const postData = {
        username: user,
        password: pass,
        uamip,
        uamport,
        challenge,
        userurl,
        client_ip: clientIp
      };

      try {
        const loginUrl = new URL("/cgi-bin/portal_login.sh", window.location.origin);
        const res = await fetch(loginUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(postData)
        });
        const rawBody = await res.text();
        let data = null;

        try {
          data = rawBody ? JSON.parse(rawBody) : null;
        } catch (parseError) {
          const compactBody = String(rawBody || "").trim();
          if (/forbidden/i.test(compactBody)) {
            throw new Error("CGI /cgi-bin/portal_login.sh bi tu choi. Hay kiem tra quyen thuc thi va cau hinh CGI tren server.");
          }
          throw new Error("Portal login endpoint khong tra ve JSON hop le.");
        }

        if (!res.ok) {
          throw new Error(data?.message || `Server returned status: ${res.status}`);
        }

        if (data.success) {
          const resolvedClientIp = data.client_ip || clientIp || "";
          const resolvedUserUrl = data.redirect || userurl || "";
          clientIp = resolvedClientIp;
          userurl = resolvedUserUrl;
          savePortalContext();
          window.location.href = buildSessionPageUrl(resolvedClientIp);
          return;
        }

        showError(data.message || "Login failed due to an unknown error.");
      } catch (e) {
        console.error("Login request failed:", e);
        showError(e?.message || "Login request failed. Please check the network or contact support.");
      } finally {
        setSubmitting(false);
      }
    }

    loginFormEl.addEventListener("submit", function (event) {
      event.preventDefault();
      submitLogin();
    });

    togglePasswordButtonEl.addEventListener("click", () => {
      const visible = passwordInputEl.type !== "text";
      passwordInputEl.type = visible ? "text" : "password";
      togglePasswordButtonEl.classList.toggle("is-visible", visible);
      togglePasswordButtonEl.setAttribute("aria-label", visible ? "Hide password" : "Show password");
      togglePasswordButtonEl.setAttribute("title", visible ? "Hide password" : "Show password");
      passwordInputEl.focus({ preventScroll: true });
    });

    updatePortalDetails();
    redirectIfAlreadyLoggedIn();
  </script>
</body>
</html>
