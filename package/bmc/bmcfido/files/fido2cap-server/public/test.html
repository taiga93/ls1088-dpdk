<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #ff9f1c, #ff7a18, #ff5d00);
        }

        .container {
            width: 1000px;
            height: 560px;
            display: flex;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
            background: #fff;
        }

        /* LEFT PANEL */
        .left {
            flex: 0.9;
            padding: 60px 50px;
            color: #333;
            background: #ffffff;
            position: relative;
        }

        .left h1 {
            font-size: 42px;
            margin-bottom: 16px;
            color: #ff8c1a;
        }

        .left p {
            font-size: 16px;
            line-height: 1.6;
            max-width: 420px;
            opacity: 0.9;
            color: #555;
        }

        .shape {
            position: absolute;
            border-radius: 50px;
            opacity: 0.25;
        }

        .shape.one {
            width: 220px;
            height: 40px;
            bottom: 120px;
            left: 80px;
            background: linear-gradient(90deg, #ffb703, #ff7aa2);
            transform: rotate(-30deg);
        }

        .shape.two {
            width: 180px;
            height: 36px;
            bottom: 60px;
            left: 200px;
            background: linear-gradient(90deg, #ffd166, #f15bb5);
            transform: rotate(-30deg);
        }

        .shape.three {
            width: 260px;
            height: 44px;
            bottom: 160px;
            left: 300px;
            background: linear-gradient(90deg, #ff9f1c, #ff5d8f);
            transform: rotate(-30deg);
        }

        /* RIGHT PANEL */
        .right {
            flex: 1.1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
        }

        .login-box {
            width: 340px;
            text-align: center;
        }

        .login-box h2 {
            color: #ff9f1c;
            letter-spacing: 1px;
            margin-bottom: 28px;
        }

        .field {
            position: relative;
            margin-bottom: 16px;
            transition: all 0.3s ease;
        }

        .field.hidden {
            opacity: 0;
            height: 0;
            margin-bottom: 0;
            overflow: hidden;
        }

        .field input {
            width: 100%;
            padding: 12px 44px;
            border-radius: 30px;
            border: none;
            background: #f0efff;
            font-size: 14px;
            outline: none;
        }

        .icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
            color: #6c63ff;
        }

        .options {
            display: flex;
            align-items: center;
            font-size: 13px;
            color: #666;
            margin-bottom: 22px;
            gap: 8px;
            text-align: left;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(90deg, #ff9f1c, #ff5d8f);
        }

        .login-btn:hover {
            opacity: 0.9;
        }

        @media (max-width: 900px) {
            .container {
                flex-direction: column;
                width: 90%;
                height: auto;
            }

            .left {
                padding: 50px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- LEFT -->
        <div class="left">
            <h1>Welcome to BMC</h1>
            <img src="img/logoBMC.png" alt="IMG" style="margin-top:34px; max-width:260px">

            <div class="shape one"></div>
            <div class="shape two"></div>
            <div class="shape three"></div>
        </div>

        <!-- RIGHT -->
        <div class="right">
            <div class="login-box">
                <h2>USER LOGIN</h2>

                <!-- Username -->
                <div class="field" id="usernameField">
                    <input type="text" placeholder="Username" />
                </div>

                <!-- Option -->
                <div class="options">
                    <input type="checkbox" id="skipUsername" />
                    <label for="skipUsername">
                        Nhập username hoặc bỏ qua để sử dụng thiết bị xác thực của bạn
                    </label>
                </div>

                <button class="login-btn">LOGIN WITH FIDO</button>
            </div>
        </div>
    </div>

    <script>
        const checkbox = document.getElementById('skipUsername');
        const usernameField = document.getElementById('usernameField');

        checkbox.addEventListener('change', () => {
            if (checkbox.checked) {
                usernameField.classList.add('hidden');
            } else {
                usernameField.classList.remove('hidden');
            }
        });
    </script>

</body>

</html>
