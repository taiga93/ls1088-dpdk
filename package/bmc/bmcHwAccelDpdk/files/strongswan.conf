# /etc/strongswan.d/bmchwaccel.conf, of bmcHwAccelDpdk (ticket 23 of
# .scratch/hw-accel-ls1088). The SEC checks the anti-replay window of an
# inbound SA once the jobs of the SA ran side by side on its DECOs, so the
# ESP of a peer comes to the check more out of order than it left the peer:
# with the default window of 32 the SEC refuses some of it, and that ESP
# goes through the kernel. 128 is the widest window bmchwaccel-syncd hands
# over (sa.c).
charon {
	replay_window = 128
}
